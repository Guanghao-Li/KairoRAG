services:
  app:
    build: .
    env_file:
      - .env
    depends_on:
      - qdrant
    command: ["kairo", "doctor"]
    volumes:
      - ./data:/app/data
      - ./results:/app/results

  qdrant:
    image: qdrant/qdrant:v1.9.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
