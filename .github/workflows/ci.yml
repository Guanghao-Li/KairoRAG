name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,web]"

      - name: Ruff check
        run: python -m ruff check .

      - name: Secret scan
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          key_re = re.compile(r"(OPENAI_API_KEY|COHERE_API_KEY|TAVILY_API_KEY|SERPAPI_API_KEY|BING_API_KEY|VOYAGE_API_KEY|JINA_API_KEY)\s*=\s*([^\s#]+)")
          sk_re = re.compile(r"sk-[A-Za-z0-9_-]{12,}")
          ignored_dirs = {".git", ".pytest_cache", "kairorag.egg-info", ".venv", "venv"}
          ignored_files = {".env.example"}

          def placeholder(value: str) -> bool:
              clean = value.strip().strip('"').strip("'").lower()
              return (
                  clean in {"", "...", "placeholder", "secret", "your-key", "changeme", "<your-key>"}
                  or clean.startswith("<")
                  or any(token in clean for token in ("placeholder", "secret", "redacted", "example"))
              )

          hits = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or path.name in ignored_files:
                  continue
              if any(part in ignored_dirs for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for match in sk_re.finditer(text):
                  if not placeholder(match.group(0)):
                      hits.append(f"{path}: 疑似 OpenAI secret")
              for match in key_re.finditer(text):
                  if not placeholder(match.group(2)):
                      hits.append(f"{path}: {match.group(1)} 疑似真实值")
          if hits:
              print("\n".join(hits))
              sys.exit(1)
          PY

      - name: Import smoke test
        run: |
          python - <<'PY'
          import kairorag
          import kairorag.cli
          import kairorag.cloud.query_cli
          import kairorag.cloud.agent.cli
          print("import smoke ok")
          PY

      - name: CLI help smoke test
        run: |
          python -m kairorag.cli --help
          python -m kairorag.cli index --help
          python -m kairorag.cli query --help
          python -m kairorag.cli agent --help
          python -m kairorag.cli verify --help
          python -m kairorag.cli eval --help
          python -m kairorag.cli doctor --help
          python -m kairorag.cli config --help
          python -m kairorag.cloud.query_cli --help
          python -m kairorag.cloud.agent.cli --help

      - name: Pytest
        run: python -m pytest
