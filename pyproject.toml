[project]
name = "kairorag"
version = "0.1.0"
description = "KairoRAG: Agentic Knowledge Retrieval System"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Logic" }]
dependencies = []

[project.optional-dependencies]
web = ["requests>=2.28.0", "beautifulsoup4>=4.12.0"]
dev = ["pytest>=7.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kairorag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

