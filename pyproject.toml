[project]
name = "kairorag"
version = "0.1.0"
description = "KairoRAG: Agentic Knowledge Retrieval System"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Logic" }]
dependencies = [
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "qdrant-client>=1.9.0",
    "rank-bm25>=0.2.2",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
web = ["requests>=2.28.0", "beautifulsoup4>=4.12.0"]
rerank-local = ["sentence-transformers>=2.7.0"]
dev = ["pytest>=7.0.0", "ruff>=0.5.0"]

[project.scripts]
kairo = "kairorag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kairorag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
